# Render Blueprint — DocuFlow AI2 (free tier)
#
# One-click deploy from the Render dashboard:
#   New -> Blueprint -> select this GitHub repo -> Apply
#
# Before applying, set the three "sync: false" secrets/values below.
# (These are NOT synced from env files on purpose.)

databases:
  - name: postgres
    databaseName: docuflow
    user: docuflow
    plan: free
    version: "16"
    ipAllowList: [] # open to all Render services

services:
  # ---- API (FastAPI) -----------------------------------------------------
  - type: web
    name: api
    runtime: docker
    repo: https://github.com/<you>/<repo>.git # TODO: your repo
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString # external URL (API is a separate service)
      - key: REDIS_URL
        sync: false
        value: redis://default:<upstash-token>@<upstash-host>:6379 # TODO: Upstash
      - key: AUTH_SECRET
        sync: false
        value: change-me-to-a-long-random-string # TODO: openssl rand -hex 32
      - key: WORKFLOW_ENGINE
        value: celery
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

  # ---- Worker (Celery) ---------------------------------------------------
  - type: worker
    name: worker
    runtime: docker
    repo: https://github.com/<you>/<repo>.git # TODO: your repo
    dockerContext: .
    dockerfilePath: ./apps/worker/Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
        value: redis://default:<upstash-token>@<upstash-host>:6379 # TODO: same as API
      - key: WORKFLOW_ENGINE
        value: celery
    startCommand: celery -A apps.worker.worker.celery_app worker -Q workflow --loglevel info